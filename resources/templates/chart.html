<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Market Chart - {{ stats.stock_name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7fa;
        }
        .container-fluid {
            padding: 20px;
        }
        .chart-container {
            background-color: #fff;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            width: 100%;
            height: 100%;
        }
        .btn-back {
            margin-bottom: 1rem;
        }
        #plotly-chart {
            width: 100%;
            height: 800px;
        }
        .stock-header {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .btn-back {
            margin-right: 20px;
            margin-bottom: 0;
        }
        
        h2 {
            margin-bottom: 0;
        }

        @media (max-width: 768px) {
            #plotly-chart {
                height: 600px;
            }
            .container-fluid {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="stock-header">
            <a href="/" class="btn btn-outline-primary btn-back">← Back to Home</a>
            <h2>
                {{ stats.stock_name }} Stock Analysis
            </h2>
        </div>
        
        <div class="row">
            <div class="col-12">
                <div class="chart-container">
                    <div id="plotly-chart"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Parse the plot JSON and create the Plotly chart
        const plotJson = {{ plot_json|safe }};
        
        // Ensure the xaxis type is set to date for the rangeselector to work
        if (plotJson.layout && plotJson.layout.xaxis) {
            plotJson.layout.xaxis.type = "date";
            
            // Make sure rangeselector is properly configured
            if (!plotJson.layout.xaxis.rangeselector) {
                plotJson.layout.xaxis.rangeselector = {
                    buttons: [
                        {count: 1, label: "1m", step: "month", stepmode: "backward"},
                        {count: 6, label: "6m", step: "month", stepmode: "backward"},
                        {count: 1, label: "YTD", step: "year", stepmode: "todate"},
                        {count: 1, label: "1y", step: "year", stepmode: "backward"},
                        {step: "all", label: "All"}
                    ],
                    bgcolor: 'rgba(150, 200, 250, 0.4)',
                    x: 1,
                    xanchor: 'right',
                    y: 1.15
                };
            }
            
            // Ensure rangeslider is visible
            if (!plotJson.layout.xaxis.rangeslider) {
                plotJson.layout.xaxis.rangeslider = {
                    visible: true,
                    thickness: 0.03
                };
            }
        }
        
        // Make the chart responsive and enable all interactive features
        const config = {
            responsive: true,
            displayModeBar: true,
            scrollZoom: true,
            displaylogo: false,
            modeBarButtonsToAdd: ['drawline', 'drawopenpath', 'eraseshape']
        };
        
        Plotly.newPlot('plotly-chart', plotJson.data, plotJson.layout, config);
        
        // Make chart responsive on window resize
        window.addEventListener('resize', function() {
            Plotly.relayout('plotly-chart', {
                'xaxis.autorange': true,
                'yaxis.autorange': true
            });
        });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
